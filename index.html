<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description"
      content="Ajinkya Kale is a backend engineer at Fleetx working on real-time telematics pipelines, and co-founder of Anchora, a study-abroad planner for students in India." />
    <meta name="keywords"
      content="Ajinkya Kale, Backend Engineer, Anchora, Fleetx, Java, Spring Boot, Kafka, Spark, Netty, Distributed Systems" />
    <meta name="author" content="Ajinkya Kale" />

    <meta property="og:title" content="Ajinkya Kale — Backend engineer, co-founder of Anchora" />
    <meta property="og:description"
      content="Real-time data systems at Fleetx. Building Anchora, a study-abroad planner, end to end." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ajkale.com" />
    <meta property="og:site_name" content="Ajinkya Kale" />
    <meta property="og:image" content="https://ajkale.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"
      content="Ajinkya Kale, Backend Engineer and Co-Founder of Anchora. Real-time systems at Fleetx; building Anchora, a study-abroad planner." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ajinkya Kale — Backend engineer, co-founder of Anchora" />
    <meta name="twitter:description"
      content="Real-time data systems at Fleetx. Building Anchora, a study-abroad planner, end to end." />
    <meta name="twitter:image" content="https://ajkale.com/og.png" />
    <meta name="twitter:image:alt"
      content="Ajinkya Kale, Backend Engineer and Co-Founder of Anchora. Real-time systems at Fleetx; building Anchora, a study-abroad planner." />

    <!-- The two fonts on the first screen (body text; nav and word bands), fetched alongside the
         script so text is already in its final font when the loader opens. See src/index.css. -->
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/figtree-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/geist-mono-latin.woff2" crossorigin />

    <script>
      // Marks that JavaScript runs, so the build-time copy of the page in #root stays hidden until
      // React replaces it (crawlers and no-JS visitors still read it).
      document.documentElement.classList.add("js");
      // Dark by default; a saved choice wins. Runs before paint to avoid a theme flash.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
    <style>
      .js [data-prerendered] { display: none; }
      /* The first-load reveal only shows where the script will run and motion is allowed. */
      #loader { display: none; }
      .js #loader { display: block; }
      @media (prefers-reduced-motion: reduce) {
        .js #loader { display: none; }
      }
    </style>
    <title>Ajinkya Kale</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- First-load reveal. It is here rather than in React so the dot can start growing while the
         script downloads; Loader.tsx opens it once the page has rendered, then removes it. -->
    <div id="loader" aria-hidden="true" class="loader pointer-events-auto fixed inset-0 z-[100]">
      <div class="loader-curtain absolute inset-0 bg-background"></div>
      <div class="loader-disc absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 rounded-full"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
